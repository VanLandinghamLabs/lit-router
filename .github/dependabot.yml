version: 2

updates:
  # Workflow action pins. Minor and patch bumps are grouped, since they land
  # together and a split would cost two CI runs to no benefit.
  #
  # Majors are deliberately left out of the group, so each arrives as its own
  # PR. A group that includes them produces one PR crossing several major
  # boundaries at once, which is untestable in the sense that matters: a
  # failure names the batch rather than the dependency that caused it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # devDependencies only move the lockfile and the test toolchain, so minor and
  # patch bumps are grouped and left to CI to judge. Majors arrive singly for
  # the reason above: #18 grouped five of them, including TypeScript 5 to 7 and
  # web-test-runner 0.20 to 1.0, into one PR.
  #
  # `lit` is not grouped with them. It is the only runtime dependency, its
  # range is deliberately wide (`^3.0.0`), and a PR against it means a new
  # major that wants a decision about the supported range.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
